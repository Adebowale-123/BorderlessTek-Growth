# Render Blueprint: one free web service. The database is external (Neon free PostgreSQL):
# paste Neon's connection string as DATABASE_URL when deploying.
services:
  - type: web
    name: borderlesstek-growth
    runtime: python
    plan: free
    region: frankfurt  # closest Render region to the UK; create the Neon database in Europe too
    buildCommand: "./build.sh"
    # One process with threads, so the background scan and the pages share one place.
    startCommand: "gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: TIME_ZONE
        value: Europe/London
      # cron-job.org calls /tick/?key=TICK_KEY every 30 minutes: searches when due, sends the daily summary,
      # and keeps the free service awake.
      - key: TICK_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
