{% extends "registration/_auth.html" %}
{% block title %}Forgot password{% endblock %}
{% block box %}
<h1>Forgot password</h1>
<p class="muted">Enter your username or email and we'll give you a link to choose a new password.</p>
<form method="post" class="stack" style="margin-top:20px">
  {% csrf_token %}
  <div class="field"><label for="id_email">Username or email</label>{{ form.email }}{{ form.email.errors }}</div>
  <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Get reset link</button>
</form>
{% endblock %}
